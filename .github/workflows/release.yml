name: Release Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag and manifest version
        shell: bash
        run: |
          manifest_version=$(node -p "require('./module.json').version")
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Tag v${tag_version} does not match module.json version ${manifest_version}."
            exit 1
          fi

      - name: Run tests
        run: node --test

      - name: Build Macro Compendium
        shell: bash
        run: |
          node tools/build-macro-sources.mjs
          rm -rf packs/night-assassins-macros
          npx --yes @foundryvtt/foundryvtt-cli@3.0.4 package pack \
            --type Module \
            --id night-assassins-csb-automation \
            --compendiumName night-assassins-macros \
            --inputDirectory build/compendium/macros \
            --outputDirectory packs

      - name: Build Template Compendiums
        shell: bash
        run: |
          node tools/build-template-sources.mjs
          rm -rf packs/night-assassins-slayer packs/night-assassins-onis packs/night-assassins-templates-de-ficha
          npx --yes @foundryvtt/foundryvtt-cli@3.0.4 package pack \
            --type Module \
            --id night-assassins-csb-automation \
            --compendiumName night-assassins-templates-de-ficha \
            --inputDirectory build/compendium/templates-de-ficha \
            --outputDirectory packs

      - name: Build Breathing Item Compendium
        shell: bash
        run: |
          node tools/build-breathing-sources.mjs
          rm -rf packs/night-assassins-respiracoes
          npx --yes @foundryvtt/foundryvtt-cli@3.0.4 package pack \
            --type Module \
            --id night-assassins-csb-automation \
            --compendiumName night-assassins-respiracoes \
            --inputDirectory build/compendium/respiracoes \
            --outputDirectory packs
      - name: Build Art Compendium
        shell: bash
        run: |
          node tools/build-asset-sources.mjs
          rm -rf packs/night-assassins-arte
          npx --yes @foundryvtt/foundryvtt-cli@3.0.4 package pack \
            --type Module \
            --id night-assassins-csb-automation \
            --compendiumName night-assassins-arte \
            --inputDirectory build/compendium/artes \
            --outputDirectory packs
      - name: Build Slayer Weapon Compendium
        shell: bash
        run: |
          node tools/build-weapon-sources.mjs
          rm -rf packs/night-assassins-armas-slayer
          npx --yes @foundryvtt/foundryvtt-cli@3.0.4 package pack \
            --type Module \
            --id night-assassins-csb-automation \
            --compendiumName night-assassins-armas-slayer \
            --inputDirectory build/compendium/armas-slayer \
            --outputDirectory packs
      - name: Build module.zip
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node tools/prepare-package-tree.mjs
          rm -f module.zip
          cd build/package
          zip -r ../../module.zip \
            module.json \
            scripts \
            catalogs \
            styles \
            lang \
            packs \
            assets/icons \
            README.md \
            CHANGELOG.md
          cd ../..

          test "$(unzip -Z1 module.zip | head -n 1)" = "module.json"
          unzip -Z1 module.zip | grep -qx "catalogs/slayer/origins.json"
          unzip -Z1 module.zip | grep -qx "catalogs/slayer/progression.json"
          unzip -Z1 module.zip | grep -qx "catalogs/slayer/classes.json"
          unzip -Z1 module.zip | grep -qx "assets/icons/templates/na-oni-template_icon.webp"
          unzip -Z1 module.zip | grep -qx "assets/icons/macros/na_roll_damage_icon.webp"
          unzip -Z1 module.zip | grep -qx "assets/icons/weapons/katana_icon.webp"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Night Assassins CSB Automation ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
