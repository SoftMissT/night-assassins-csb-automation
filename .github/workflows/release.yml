name: Release Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag and manifest version
        shell: bash
        run: |
          manifest_version=$(node -p "require('./module.json').version")
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "Tag v${tag_version} does not match module.json version ${manifest_version}."
            exit 1
          fi

      - name: Run tests
        run: node --test

      - name: Build module.zip
        shell: bash
        run: |
          zip -r module.zip \
            module.json \
            scripts \
            styles \
            lang \
            README.md \
            CHANGELOG.md

          test "$(unzip -Z1 module.zip | head -n 1)" = "module.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Night Assassins CSB Automation ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
